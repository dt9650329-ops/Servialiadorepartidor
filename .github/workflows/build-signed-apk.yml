name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix background-runner native library
        run: |
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs
          cp node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar android/capacitor-cordova-android-plugins/src/main/libs/android-js-engine-release.aar

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/servi-aliados-repartidor.keystore

      - name: Build release APK
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease \
            -PRELEASE_STORE_FILE="$(pwd)/app/servi-aliados-repartidor.keystore" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Renombrar APK
        run: |
          cd android
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/servi-aliados-repartidor.apk

      - name: Debug signing
        run: |
          cd android
          echo "--- Verificando keystore ---"
          ls -la app/servi-aliados-repartidor.keystore
          echo "--- Contenido del keystore (con password de secrets) ---"
          keytool -list -v -keystore app/servi-aliados-repartidor.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" || echo "FALLO AL LEER KEYSTORE CON ESA PASSWORD/ALIAS"
          echo "--- Verificando APK generado ---"
          keytool -printcert -jarfile app/build/outputs/apk/release/servi-aliados-repartidor.apk || echo "APK NO FIRMADO"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: servi-aliados-repartidor
          path: capacitor-app/android/app/build/outputs/apk/release/servi-aliados-repartidor.apk
