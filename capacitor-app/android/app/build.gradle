apply plugin: 'com.android.application'

android {
    signingConfigs {
        release {
            println "DEBUG hasProperty RELEASE_STORE_FILE = ${project.hasProperty('RELEASE_STORE_FILE')}"
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                def sf = file(RELEASE_STORE_FILE)
                println "DEBUG storeFile path=${sf} exists=${sf.exists()}"
                println "DEBUG storePassword length=${RELEASE_STORE_PASSWORD.length()}"
                println "DEBUG keyAlias=[${RELEASE_KEY_ALIAS}] length=${RELEASE_KEY_ALIAS.length()}"
                println "DEBUG keyPassword length=${RELEASE_KEY_PASSWORD.length()}"
            }
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    namespace = "com.servialiados.repartidor"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.servialiados.repartidor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// ðŸ†• FIX 2026-08-25: fuerza androidx.credentials a 1.3.0+ â€” versiones mÃ¡s
// viejas de esta librerÃ­a fallan con "Your device doesn't support credential
// manager" en varios celulares (confirmado en Oppo/ColorOS y otros). Es el
// mismo fix que ya tiene el build.gradle del cliente.
configurations.all {
    resolutionStrategy {
        force 'androidx.credentials:credentials:1.3.0'
        force 'androidx.credentials:credentials-play-services-auth:1.3.0'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // ðŸ†• Crashlytics: SDK nativo (ademÃ¡s de lo que ya trae el plugin de
    // Capacitor). El BoM asegura versiones compatibles entre sÃ­ sin tener
    // que fijar el nÃºmero de versiÃ³n a mano.
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-crashlytics'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // ðŸ†• Crashlytics: se aplica DESPUÃ‰S de google-services, en el mismo
        // bloque protegido â€” asÃ­ si algÃºn dÃ­a falta google-services.json,
        // tampoco intenta aplicar Crashlytics (que tambiÃ©n lo necesita).
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
